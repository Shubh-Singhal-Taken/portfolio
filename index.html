    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f0f" />
    <!-- Title, description, canonical, social tags and structured data are
         set per page (src/app/components/PageMeta.tsx) at build time. -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="preload" href="/fonts/lato-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
